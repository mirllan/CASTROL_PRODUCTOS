name = "castrol-portafolio-proxy"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
PORTAFOLIO_ENDPOINT_URL = "https://botai.smartdataautomation.com/api_backend_ai/dinamic-db/report/119/castrol_portafolio"
# Orígenes separados por coma. GitHub Pages usa solo el dominio, sin la ruta del repositorio.
ALLOWED_ORIGINS = "https://mirllan.github.io,http://localhost:5500,http://127.0.0.1:5500"
# Segundos que la copia guardada se considera reciente antes de actualizarla.
CACHE_FRESH_SECONDS = "900"

[[kv_namespaces]]
binding = "PORTAFOLIO_CACHE"
id = "05e6cc1ebc0d49259808517f35cde459"
